[project]
name = "fastapi-ai-starter"
version = "0.1.0"
description = "Production-ready FastAPI starter for AI-first APIs (RodiumAI provider)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "passlib[argon2]>=1.7.4",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "orjson>=3.10.0",
    "greenlet>=3.1.0",
    "aiofiles>=25.1.0",
    "psycopg[binary]>=3.3.6",
    "cloudinary>=1.46.2",
    "higgsfield-client>=0.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "types-passlib>=1.7.7",
    "types-PyJWT>=1.7.1",
    "types-redis>=4.6.0",
    "aiosqlite>=0.20.0",
]
# Optional local WhisperX (uv sync --group asr).
# Note: torch/whisperx need arm64 mac or Linux; on Intel mac auto falls back to Rodium
# after 16kHz WAV extract.
asr = [
    "torch>=2.2.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "whisperx>=3.3.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*", "passlib.*", "aiofiles.*", "redis.*", "whisperx.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
